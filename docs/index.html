  body{max-width:44rem;margin:4rem auto;padding:0 1.5rem;

<h1>日迹</h1>
<p class="sub">任务挂在截止日上，每天记一笔做过什么。</p>

<div class="card">
  <strong>dsh-priority</strong><br>
  <span class="tag">任务</span><span class="tag">记录</span><span class="tag">不含 AI</span>
  <p style="margin:.8rem 0 0;color:#6b675f">
    按截止日期分组的列表，每张卡下是你手写的过程记录。顶部有日期条，能翻回任何一天看当时到期的、动过的、完成了什么。
  </p>
</div>

<h2>在 DSH 里加这个索引</h2>
<pre>设置 → 插件市场 → 添加索引源
https://x-x-gpu.github.io/dsh-priority/index.json</pre>

<h2>或者直接装</h2>
<pre>pnpm add dsh-priority</pre>
