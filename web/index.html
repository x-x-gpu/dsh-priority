<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日迹</title>
<script>
// The canvas is same-origin. Read DSH's rendered theme before the first paint;
// observe its resolved marker so explicit and system themes behave identically.
(() => {
  const root = document.documentElement;
  const system = matchMedia('(prefers-color-scheme: dark)');
  let hostBody = null;
  try { if (parent !== window) hostBody = parent.document.body; } catch (_) {}
  const sync = () => {
    root.dataset.theme = (hostBody ? hostBody.hasAttribute('data-ds-dark-theme') : system.matches) ? 'dark' : 'light';
  };
  const observer = hostBody ? new MutationObserver(sync) : null;
  const connect = () => {
    sync();
    if (observer) observer.observe(hostBody, { attributes: true, attributeFilter: ['data-ds-dark-theme'] });
    else system.addEventListener('change', sync);
  };
  connect();
  window.addEventListener('pagehide', () => {
    if (observer) observer.disconnect();
    else system.removeEventListener('change', sync);
  });
  window.addEventListener('pageshow', connect);
})();
</script>
<style>
  :root{
    color-scheme:light;
    --paper:#f7f6f3; --ink:#1c1b19; --muted:#8c887f; --line:#e8e4db;
    --card:#fffefb; --accent:#3d63d6; --hot:#d34b45; --warn:#c98a1b; --ok:#2f855a;
    --shadow:0 1px 2px rgba(30,27,22,.05), 0 4px 14px rgba(30,27,22,.06);
    --top:rgba(247,246,243,.94);
    --danger-fill:#b83d38;

    --control:#fff;
    --hot-border:#f0cfcd;
    --hot-soft:#fff6f5;
    --warn-text:#8a5f0f;
    --warn-border:#f0e0bd;
    --warn-soft:#fffbf0;
    --ok-border:#cfe6d9;
    --ok-soft:#f4fbf7;
    --text-secondary:#3b3833;
    --control-hover:#fdfcfa;
    --border-hover:#d3ccbf;
    --primary-hover:#333;
    --caption:#b3ada2;
    --card-border-hover:#d8d2c6;
    --completed:#fbfaf7;
    --text-completed:#a8a29a;
    --grip:#b9b2a4;
    --flag:#f1efe9;
    --text-detail:#6b675f;
    --hot-flag:#fdecea;
    --warn-flag:#fdf6e3;
    --ok-flag:#eef7f1;
    --action-hover:#f6f4ef;
    --ok-hover-border:#bcd9c8;
    --ok-hover:#f2fbf6;
    --delete-muted:#a89f94;
    --delete-border:#e6c4c1;
    --delete-hover:#fdf4f3;
    --delete-armed-hover:#b83d38;
    --log:#faf9f6;
    --log-delete:#d6d0c4;
    --quiet:#c9a86a;
    --empty:#c0bab0;
    --history-title:#2f2c28;
    --ghost-border:#d9d3c7;
    --ghost:#fbfaf6;
    --ghost-hover-border:#c6bfb0;
    --ghost-hover:#f8f6f1;
    --ghost-title:#4a463f;
    --banner-button-border:#e3d3b0;
    --drop:#f0f5ff;
    --session:#f0eee9;
    --session-next:#eeece6;
    --session-hover:#e9edf5;
    --session-arrow:#92979f;
    --session-mark:#9299a6;
    --session-title:#565a62;
    --session-unlink:#8b8d93;
    --drop-border:#9db0e7;
    --toast:#2b2925;
    --toast-text:#f5f2ec;
    --toast-error:#8f2b28;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#19191c; --ink:#ebebf0; --line:#37373d;
    --accent:#91adff; --hot:#f18f8b; --warn:#e6bc70; --ok:#86cba2;
    --shadow:0 1px 2px #0003, 0 4px 14px #0002;
    --top:rgba(25,25,28,.94);
    --control:#252529;
    --hot-border:#633c3c;
    --hot-soft:#352628;
    --warn-text:#e6bc70;
    --warn-border:#5c4b30;
    --warn-soft:#302b22;
    --ok-border:#365344;
    --ok-soft:#22322b;
    --text-secondary:#d0d0d5;
    --control-hover:#303035;
    --border-hover:#505057;
    --primary-hover:#d6d8df;
    --caption:#9b9ba5;
    --card-border-hover:#48484f;
    --completed:#202023;
    --text-completed:#a2a2aa;
    --grip:#85858f;
    --flag:#303034;
    --text-detail:#b3b3bd;
    --hot-flag:#3a282b;
    --warn-flag:#393022;
    --ok-flag:#26372d;
    --action-hover:#323237;
    --ok-hover-border:#426951;
    --ok-hover:#293d31;
    --delete-muted:#a3a0a4;
    --delete-border:#704449;
    --delete-hover:#422a2f;
    --delete-armed-hover:#aa3737;
    --log:#222225;
    --log-delete:#a0a0aa;
    --quiet:#d2ad6a;
    --empty:#9b9ba5;
    --history-title:#dddde3;
    --muted:#aaaab4;
    --ghost-border:#47474e;
    --ghost:#202023;
    --ghost-hover-border:#62626d;
    --ghost-hover:#2a2a30;
    --ghost-title:#c9c9d2;
    --banner-button-border:#655438;
    --drop:#252f46;
    --session:#28282d;
    --session-next:#242429;
    --session-hover:#303545;
    --session-arrow:#a7afc1;
    --session-mark:#a0abc2;
    --session-title:#c2c5d0;
    --session-unlink:#a6a6b1;
    --drop-border:#829fe7;
    --toast:#e4e4ec;
    --toast-text:#202024;
    --toast-error:#8f2b28;
    --card:#242427;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:13.5px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;
    overflow-y:auto;
  }
  #top{position:sticky;top:0;z-index:10;background:var(--top);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px}
  #top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #top h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.01em}
  .pill{font-size:11.5px;color:var(--muted);background:var(--control);border:1px solid var(--line);
    border-radius:999px;padding:2px 9px;white-space:nowrap}
  .pill.hot{color:var(--hot);border-color:var(--hot-border);background:var(--hot-soft)}
  .pill.warn{color:var(--warn-text);border-color:var(--warn-border);background:var(--warn-soft)}
  .pill.ok{color:var(--ok);border-color:var(--ok-border);background:var(--ok-soft)}
  .grow{flex:1}
  button.tool{font:inherit;font-size:12px;background:var(--control);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--text-secondary);transition:.12s}
  button.tool:hover{background:var(--control-hover);border-color:var(--border-hover)}
  button.tool.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button.tool.primary:hover{background:var(--primary-hover)}

  #list{padding:8px 26px 120px;max-width:1100px;margin:0 auto}
  .bucket{margin:22px 0 0}
  .bucket .head{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;padding-left:2px}
  .bucket .date{font-size:12.5px;font-weight:600;letter-spacing:.01em}
  .bucket .rel{font-size:11.5px;color:var(--muted)}
  .bucket.overdue .date{color:var(--hot)}
  .bucket.today .date{color:var(--accent)}
  .bucket .count{font-size:11.5px;color:var(--caption);margin-left:auto}

  .card{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;margin:0 0 7px;box-shadow:var(--shadow);
    transition:border-color .12s, box-shadow .12s, transform .12s;position:relative}
  .card:hover{border-color:var(--card-border-hover)}
  .card.dragging{opacity:.55;box-shadow:0 8px 24px rgba(30,27,22,.16);z-index:5}
  .card.over{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,99,214,.13)}
  .card.done{background:var(--completed)}
  .card.done .title{color:var(--text-completed)}
  .card.done .title::after{content:" 已提交";font-size:11px;color:var(--ok)}
  .card.done.pending .title::after{content:" 待提交";color:var(--warn)}
  .card.done.plain-done .title::after{content:" 已完成";color:var(--text-completed)}
  .card.dropped{opacity:.5}
  .card.dropped .title{text-decoration:line-through;color:var(--text-completed)}
  .card.dropped .title::after{content:" 已放弃";text-decoration:none;font-size:11px;color:var(--text-completed)}

  .grip{width:16px;flex:none;align-self:stretch;cursor:grab;border-radius:4px;opacity:.42;
    background-image:radial-gradient(circle,var(--grip) 1.1px,transparent 1.2px);
    background-size:6px 6px;background-position:center;background-repeat:repeat-y;transition:opacity .12s}
  .grip:hover{opacity:.95}
  .grip:active{cursor:grabbing}

  .main{flex:1;min-width:0}
  .title{font-size:13.5px;font-weight:600;line-height:1.45;margin:0 0 2px;word-break:break-word}
  .meta{display:flex;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
  .meta .flag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--flag);color:var(--text-detail)}
  .meta .flag.hot{background:var(--hot-flag);color:var(--hot)}
  .meta .flag.warn{background:var(--warn-flag);color:var(--warn-text)}
  .meta .flag.ok{background:var(--ok-flag);color:var(--ok)}
  .meta input[type=date]{font:inherit;font-size:11.5px;border:1px solid transparent;background:transparent;
    color:var(--muted);padding:0 2px;border-radius:4px;cursor:pointer}
  .meta input[type=date]:hover{border-color:var(--line);background:var(--control)}

  .acts{display:flex;gap:5px;flex:none;opacity:0;transition:opacity .12s}
  .card:hover .acts,.card:focus-within .acts{opacity:1}
  .acts button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--control);
    border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--text-detail);white-space:nowrap}
  .acts button:hover{background:var(--action-hover);border-color:var(--border-hover)}
  .acts button.done-btn:hover{border-color:var(--ok-hover-border);background:var(--ok-hover);color:var(--ok)}
  .acts button.del-btn{color:var(--delete-muted)}
  .acts button.del-btn:hover{border-color:var(--delete-border);background:var(--delete-hover);color:var(--hot)}
  .acts button.del-btn.armed{border-color:var(--hot);background:var(--danger-fill);color:#fff}
  .acts button.del-btn.armed:hover{background:var(--delete-armed-hover)}

  /* 删除：常驻右上角，平时几乎隐形，悬停卡片才明显 */
  .xdel{position:absolute;right:6px;top:6px;width:20px;height:20px;display:flex;
    align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;
    color:var(--text-completed);font-size:15px;line-height:1;cursor:pointer;padding:0;opacity:1;
    border:1px solid transparent;transition:.12s}
  .xdel:hover{background:var(--delete-hover);color:var(--hot);border-color:var(--delete-border)}
  .xdel:hover{background:var(--delete-hover);color:var(--hot)}
  .xdel.armed{opacity:1;background:var(--danger-fill);color:#fff;font-size:10px;width:auto;padding:0 7px;border-radius:5px}
  .xdel.armed:hover{background:var(--delete-armed-hover)}

  .logline{margin:8px 0 0;padding:8px 10px;background:var(--log);border:1px solid var(--line);
    border-radius:7px;font-size:11.5px;color:var(--text-detail);display:none}
  .card.has-log .logline{display:block}
  .logline .entry{display:flex;gap:8px;padding:2px 0;align-items:baseline}
  .logline .entry .delx{margin-left:auto;flex:none;border:0;background:transparent;color:var(--log-delete);
    font-size:12px;line-height:1;cursor:pointer;padding:1px 4px;border-radius:4px;opacity:.6}
  .logline .entry:hover .delx{opacity:1}
  .logline .entry .delx:hover{background:var(--delete-hover);color:var(--hot)}
  .logline .entry .delx.armed{background:var(--danger-fill);color:#fff;opacity:1;font-size:10px}
  .logline .when{color:var(--caption);font-variant-numeric:tabular-nums;flex:none;width:62px}
  .logline .what{flex:1;word-break:break-word}
  .logline .quiet{color:var(--quiet);padding:3px 0 1px}
  .loginput{display:none;margin:8px 0 0;gap:7px}
  .card.logging .loginput{display:flex}
  .loginput input{flex:1;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;
    padding:6px 9px;background:var(--control);outline:none}
  .loginput input:focus{border-color:var(--accent)}

  .empty{text-align:center;color:var(--caption);padding:60px 20px;font-size:13px}
.daynav{display:flex;align-items:center;gap:7px;margin-top:11px}
  .daynav button{font:inherit;font-size:12px;background:var(--control);border:1px solid var(--line);
    border-radius:7px;padding:4px 9px;cursor:pointer;color:var(--text-secondary)}
  .daynav button:hover{background:var(--control-hover);border-color:var(--border-hover)}
  .daynav input[type=date]{font:inherit;font-size:12.5px;border:1px solid var(--line);
    border-radius:7px;padding:3px 8px;background:var(--control);color:var(--ink)}
  .daynav .lbl{font-size:12px;color:var(--muted)}
  .daynav .back{margin-left:auto;font-size:11.5px;color:var(--accent);cursor:pointer;
    background:none;border:0;padding:0}
  .daynav .back:hover{text-decoration:underline}

  .sect{margin:20px 0 0}
  .sect h3{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
  .sect h3 .n{font-size:11.5px;color:var(--caption);font-weight:400}
  .sect .none{font-size:12px;color:var(--empty);padding:2px 0 0 2px}

  .line{display:flex;gap:9px;align-items:baseline;padding:7px 12px;margin:0 0 6px;
    border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:12.5px}
  .line .lt{font-weight:600;color:var(--history-title)}
  .line .ltext{color:var(--text-detail);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .ld{margin-left:auto;color:var(--caption);white-space:nowrap;font-size:11.5px}
  .line.dim{background:var(--completed)}
  .line.dim .lt{color:var(--muted);font-weight:500}

  .ghost{display:flex;gap:9px;align-items:baseline;border:1px dashed var(--ghost-border);border-radius:10px;
    padding:8px 12px;margin:0 0 7px;background:var(--ghost);font-size:12px;color:var(--muted);cursor:pointer}
  .ghost:hover{border-color:var(--ghost-hover-border);background:var(--ghost-hover)}
  .ghost .gmark{color:var(--grip);flex:none}
  .ghost .gt{color:var(--ghost-title);font-weight:600}
  .ghost .gnote{color:var(--text-detail);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghost .gd{margin-left:auto;color:var(--caption);white-space:nowrap;flex:none}

  .banner{margin:14px 0 0;border:1px solid var(--warn-border);background:var(--warn-soft);border-radius:10px;padding:10px 14px}
  .banner .bt{font-size:12.5px;font-weight:600;color:var(--warn-text);margin:0 0 6px}
  .banner .brow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-detail);padding:3px 0}
  .banner .brow b{color:var(--text-secondary);font-weight:600}
  .banner.hot{border-color:var(--hot-border);background:var(--hot-soft)}
  .banner.hot .bt{color:var(--hot)}
  .banner button.armed{border-color:var(--hot);background:var(--hot);color:#fff}

  .archive-line{margin:16px 0 40px;text-align:center;font-size:12px;color:var(--text-faint, #b3ada2);
    cursor:pointer;padding:8px;border-radius:8px}
  .archive-line:hover{background:var(--hover-soft, rgba(127,127,127,.08))}
  .banner button{font:inherit;font-size:11.5px;border:1px solid var(--banner-button-border);background:var(--control);
    border-radius:6px;padding:2px 9px;cursor:pointer;color:var(--warn-text);margin-left:auto}
  .banner button:hover{background:var(--warn-flag)}

  .card:not(.has-sessions){padding-right:40px}
  .card.has-sessions{display:block;background:transparent;border:0;padding:0;box-shadow:none;margin-bottom:14px}
  .task-face{display:flex;gap:11px;align-items:flex-start;position:relative;z-index:2;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 40px 11px 13px;
    box-shadow:0 2px 5px rgba(35,31,24,.055)}
  .card.has-sessions:hover .task-face{border-color:var(--card-border-hover)}
  .card.has-sessions.session-over .task-face{border-color:var(--accent);background:var(--drop)}
  .card.has-sessions.done .task-face{background:var(--completed)}
  .session-links{display:flex;flex-direction:column;gap:0;min-width:0;margin:-5px 18px 0;padding:0}
  .session-row{display:flex;align-items:stretch;position:relative;min-width:0;min-height:48px;
    padding-top:5px;border:0;border-radius:0 0 9px 9px;background:var(--session);
    box-shadow:0 1px 0 rgba(88,78,59,.1);transition:background .15s}
  .session-row+.session-row{margin-top:-3px;padding-top:3px;background:var(--session-next)}
  .session-row:hover,.session-row:focus-within{background:var(--session-hover)}
  .session-row::after{content:'↗';align-self:center;margin-right:16px;color:var(--session-arrow);font-size:14px;pointer-events:none}
  .session-open{display:flex;align-items:center;gap:11px;flex:1;min-width:0;text-align:left;border:0;
    background:transparent;color:var(--ink);font:inherit;padding:14px 13px 10px;border-radius:0;cursor:pointer}
  .session-open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .session-mark{flex:none;width:20px;height:20px;font-size:0;color:var(--session-mark);display:grid;place-items:center}
  .session-mark::before{content:'';display:block;width:12px;height:10px;border:1.3px solid currentColor;border-radius:3px;
    clip-path:polygon(0 0,100% 0,100% 85%,35% 85%,18% 100%,18% 85%,0 85%)}
  .session-copy{display:flex;flex-direction:column;min-width:0;gap:2px}
  .session-title{font-size:12.5px;font-weight:500;color:var(--session-title);line-height:1.5;overflow-wrap:anywhere}
  .session-meta{display:none}
  .session-unlink{align-self:center;flex:none;margin:8px 12px 8px 0;border:1px solid transparent;background:transparent;
    color:var(--session-unlink);cursor:pointer;font:inherit;font-size:11px;border-radius:5px;padding:4px 7px;white-space:nowrap;
    opacity:0;transition:opacity .15s}
  .session-row:hover .session-unlink,.session-row:focus-within .session-unlink{opacity:1}
  @media(hover:none){.session-unlink{opacity:1}}
  .session-unlink:hover{color:var(--hot);background:var(--delete-hover);border-color:var(--delete-border)}
  .mount-hint{font-size:11.5px;color:var(--muted);margin:9px 0 0}
  body.session-drag .card{border-style:dashed;border-color:var(--drop-border)}
  .card.session-over{border:2px solid var(--accent);padding:10px 12px;background:var(--drop);box-shadow:0 0 0 3px rgba(61,99,214,.13)}
  .card.session-over::after{content:'松开以挂载对话';position:absolute;right:10px;bottom:7px;font-size:11px;color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
    background:var(--toast);color:var(--toast-text);font-size:12px;padding:8px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:.2s;z-index:30}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--toast-error);color:#fff}

  dialog{font:inherit;border:1px solid var(--line);border-radius:12px;padding:0;
    box-shadow:0 24px 60px rgba(20,18,15,.24);max-width:420px;width:calc(100% - 40px);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(30,27,22,.28)}
  dialog form{padding:18px 20px 16px;margin:0}
  dialog h2{margin:0 0 14px;font-size:14px}
  dialog label{display:block;font-size:11.5px;color:var(--muted);margin:0 0 4px}
  dialog input[type=text],dialog input[type=date]{width:100%;font:inherit;font-size:13px;
    border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin:0 0 12px;background:var(--control);outline:none}
  dialog input:focus{border-color:var(--accent)}
  dialog .check{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:0 0 14px;color:var(--text-secondary)}
  dialog .btns{display:flex;gap:8px;justify-content:flex-end}
  input{color:var(--ink);background:var(--control);accent-color:var(--accent)}
  input::placeholder{color:var(--muted);opacity:1}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::selection{background:var(--accent);color:var(--control)}
</style>
</head>
<body>

<div id="top">
  <div class="row">
    <h1>日迹</h1>
    <span class="grow"></span>
    <span id="stats"></span>
    <button class="tool primary" id="btnNew">新建</button>
    <button class="tool" id="btnRefresh">刷新</button>
  </div>
  <div class="daynav">
    <button id="dPrev">◀</button>
    <input type="date" id="dPick">
    <button id="dNext">▶</button>
    <span class="lbl" id="dRel">今天</span>
    <button class="back" id="dToday" style="display:none">回到今天</button>
  </div>
</div>

<p class="mount-hint" style="padding:0 26px;max-width:1100px;margin:12px auto 0">从左侧工作区拖动对话到日程卡片即可挂载，点击对话标题可继续会话。</p>
<div id="list"></div>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <form method="dialog">
    <h2 id="dlgTitle">新建事项</h2>
    <label for="fTitle">标题</label>
    <input type="text" id="fTitle" autocomplete="off">
    <label for="fDue">截止日期（留空表示没有期限）</label>
    <input type="date" id="fDue">
    <div class="check">
      <input type="checkbox" id="fSubmit">
      <label for="fSubmit" style="margin:0">完成之后还需要提交</label>
    </div>
    <div class="btns">
      <button class="tool" value="cancel" formnovalidate>取消</button>
      <button class="tool primary" value="ok" id="dlgOk">确定</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const API = "api";

let V = null;          // 最近一次 /state
let viewDay = null;    // 正在看哪一天；null = 今天
let D = null;          // 那一天的明细
let showArchived = false;  // 是否展开"已交且过了截止日"的那些
const listEl = document.getElementById("list");

function toast(msg, isErr) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.className = "toast"; }, 2400);
}

async function api(path, method, body) {
  const opt = { method: method || "GET", headers: {} };
  if (body !== undefined) {
    opt.headers["content-type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opt);
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch (_) { data = text; }
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

/* ---------- 日期显示 ---------- */
const WEEK = ["日","一","二","三","四","五","六"];
function relLabel(dateISO, today) {
  if (!dateISO) return "";
  const a = new Date(dateISO + "T00:00:00");
  const b = new Date(today + "T00:00:00");
  const d = Math.round((a - b) / 86400000);
  if (d < 0) return "逾期 " + (-d) + " 天";
  if (d === 0) return "今天";
  if (d === 1) return "明天";
  if (d === 2) return "后天";
  if (d <= 13) return d + " 天后";
  return "周" + WEEK[a.getDay()];
}
function dateLabel(dateISO) {
  if (!dateISO) return "以后";
  const d = new Date(dateISO + "T00:00:00");
  return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
}
function shortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso.slice(0, 10) + "T00:00:00");
  return (d.getMonth() + 1) + "/" + d.getDate();
}

/* ---------- 渲染 ---------- */
/** 某一天的视图：那天到期 / 那天动过 / 那天完成。 */
function renderDay(date) {
  listEl.innerHTML = "";
  const d = D || {};
  const st = d.stats || {};
  const parts = [];
  if (st.due) parts.push(["pill", "到期 " + st.due]);
  if (st.touch) parts.push(["pill", "动过 " + st.touch]);
  if (st.done) parts.push(["pill ok", "完成 " + st.done]);
  if (st.submitted) parts.push(["pill ok", "提交 " + st.submitted]);
  document.getElementById("stats").innerHTML = parts.map(function (q) {
    return '<span class="' + q[0] + '" style="margin-right:6px">' + esc(q[1]) + '</span>';
  }).join("");

  const mk = function (title, rows, render) {
    const sec = document.createElement("div");
    sec.className = "sect";
    const h = document.createElement("h3");
    h.textContent = title;
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = rows.length ? rows.length + " 条" : "";
    h.appendChild(n);
    sec.appendChild(h);
    if (!rows.length) {
      const none = document.createElement("div");
      none.className = "none";
      none.textContent = "—";
      sec.appendChild(none);
    } else {
      for (const r of rows) sec.appendChild(render(r));
    }
    listEl.appendChild(sec);
    return sec;
  };

  const line = function (cls, mainText, subText, rightText, onClick) {
    const el = document.createElement("div");
    el.className = "line" + (cls ? " " + cls : "");
    const t = document.createElement("span");
    t.className = "lt";
    t.textContent = mainText;
    el.appendChild(t);
    if (subText) {
      const x = document.createElement("span");
      x.className = "ltext";
      x.textContent = subText;
      el.appendChild(x);
    }
    if (rightText) {
      const r = document.createElement("span");
      r.className = "ld";
      r.textContent = rightText;
      el.appendChild(r);
    }
    if (onClick) { el.style.cursor = "pointer"; el.addEventListener("click", onClick); }
    return el;
  };

  const jump = function (id) {
    setViewDay(null);
    setTimeout(function () {
      const card = document.querySelector('[data-id="' + id + '"]');
      if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 120);
  };

  mk("那天到期", d.due || [], function (r) {
    return line(r.finishedThen ? "dim" : "", r.title, r.finishedThen ? "当时已完成" : "", "", function () { jump(r.id); });
  });

  mk("那天动过", d.touches || [], function (r) {
    const left = r.daysLeftThen === null ? "" : (r.daysLeftThen >= 0 ? "离截止 " + r.daysLeftThen + " 天" : "已逾期 " + (-r.daysLeftThen) + " 天");
    return line("", r.title, "· " + r.text, left, function () { jump(r.id); });
  });

  mk("那天完成", d.done || [], function (r) {
    return line("dim", r.title, "", "", function () { jump(r.id); });
  });

  const extra = [];
  for (const r of d.submitted || []) extra.push(["提交了 " + r.title, r]);
  for (const r of d.created || []) extra.push(["新建了 " + r.title, r]);
  if (extra.length) {
    const sec = document.createElement("div");
    sec.className = "sect";
    const h = document.createElement("h3");
    h.textContent = "其他";
    sec.appendChild(h);
    for (const [text, r] of extra) {
      const el = document.createElement("div");
      el.className = "line dim";
      const t = document.createElement("span");
      t.className = "lt";
      t.textContent = text;
      el.appendChild(t);
      el.style.cursor = "pointer";
      el.addEventListener("click", function () { jump(r.id); });
      sec.appendChild(el);
    }
    listEl.appendChild(sec);
  }
}

function render() {
  if (!V) return;
  const today = V.today;
  // 看历史某一天时，整个列表让位给"那天"的视图
  if (viewDay && viewDay !== today) { renderDay(viewDay); return; }
  listEl.innerHTML = "";

  // 统计条
  const s = V.stats;
  const parts = [];
  parts.push(['pill', s.open + " 件进行中"]);
  if (s.overdue) parts.push(['pill hot', s.overdue + " 件逾期"]);
  if (s.dueToday) parts.push(['pill hot', s.dueToday + " 件今天到期"]);
  if (s.kickoff) parts.push(['pill warn', s.kickoff + " 件该动手了"]);
  if (s.pendingSubmit) parts.push(['pill warn', s.pendingSubmit + " 件待提交"]);
  const statsEl = document.getElementById("stats");
  statsEl.innerHTML = parts.map(function (p) {
    return '<span class="' + p[0] + '" style="margin-right:6px">' + esc(p[1]) + '</span>';
  }).join("");

  // 已提交、且截止日已经过去的，从列表收起（点底部那行可以再展开）
  const archived = [];
  for (const b of V.buckets) {
    for (const i of b.items) {
      if (i.status === "submitted" && i.due && String(i.due).slice(0, 10) < today) archived.push(i);
    }
  }
  function isArchived(i) {
    return i.status === "submitted" && Boolean(i.due) && String(i.due).slice(0, 10) < today;
  }
  function hidden(i) {
    if (i.status === "dropped") return true;
    return isArchived(i) && !showArchived;
  }

  const visible = V.buckets.filter(function (b) {
    const live = b.items.some(function (i) { return !hidden(i); });
    return live || (b.ghosts && b.ghosts.length);
  });

  if (!visible.length) {
    listEl.innerHTML = '<div class="empty">还没有事项。点右上角「新建」，或者直接跟我说。</div>';
    return;
  }

  // 待提交横幅
  const pend = [];
  for (const b of V.buckets) for (const i of b.items) if (i.status === "done") pend.push(i);
  if (pend.length) {
    const bn = document.createElement("div");
    // 放得越久越显眼：3 天以上转红
    const oldest = Math.max.apply(null, pend.map(function (i) { return holdDays(i, today); }));
    bn.className = "banner" + (oldest >= 3 ? " hot" : "");
    let html = '<div class="bt">' + pend.length + ' 件做完了还没交出去</div>';
    for (const i of pend) {
      const days = holdDays(i, today);
      const due = i.due;
      const late = due && String(due).slice(0, 10) < today;
      html += '<div class="brow"><b>' + esc(i.title) + '</b>'
        + '<span>' + (due ? "截止 " + String(due).slice(5).replace("-", "/") : "没有期限") + '</span>'
        + (late ? '<span style="color:var(--hot)">已过截止</span>'
                : '<span>' + (days <= 0 ? "今天完成" : "放了 " + days + " 天") + '</span>')
        + '<button data-submit="' + esc(i.id) + '" data-armed="0">标记已提交</button></div>';
    }
    bn.innerHTML = html;
    bn.addEventListener("click", function (e) {
      const btn = e.target.closest ? e.target.closest("button[data-submit]") : null;
      if (!btn) return;
      // 两步确认：这里误点一下，一条记录就从列表里消失了
      if (btn.dataset.armed !== "1") {
        btn.dataset.armed = "1";
        btn.textContent = "确定交出去了？";
        btn.classList.add("armed");
        setTimeout(function () {
          if (!btn.isConnected) return;
          btn.dataset.armed = "0";
          btn.textContent = "标记已提交";
          btn.classList.remove("armed");
        }, 3000);
        return;
      }
      const id = btn.dataset.submit;
      api("/items/" + encodeURIComponent(id) + "/submit", "POST")
        .then(function () { return refresh(); })
        .then(function () { toast("已提交"); })
        .catch(function (err) { toast(err.message, true); });
    });
    listEl.appendChild(bn);
  }

  for (const b of visible) {
    const bucketEl = document.createElement("div");
    bucketEl.className = "bucket";
    const onlyGhosts = !b.items.length;
    // 只有幽灵的那天不是"截止日"，不该标逾期
    if (!onlyGhosts && b.date && b.date < today) bucketEl.classList.add("overdue");
    if (b.date === today) bucketEl.classList.add("today");

    const head = document.createElement("div");
    head.className = "head";
    const date = document.createElement("span");
    date.className = "date";
    date.textContent = b.date ? dateLabel(b.date) : "以后";
    head.appendChild(date);
    const rel = document.createElement("span");
    rel.className = "rel";
    rel.textContent = onlyGhosts
      ? "那天动过 " + b.ghosts.length + " 次"
      : (b.date ? relLabel(b.date, today) : "没有期限");
    head.appendChild(rel);
    const count = document.createElement("span");
    count.className = "count";
    const live = b.items.filter(function (i) { return i.status === "open"; }).length;
    count.textContent = live ? live + " 件" : "";
    head.appendChild(count);
    bucketEl.appendChild(head);

    const shown = b.items.filter(function (i) { return !hidden(i); });
    const open = shown.filter(function (i) { return i.status === "open"; });
    const closed = shown.filter(function (i) { return i.status !== "open"; });

    for (const it of open) bucketEl.appendChild(cardEl(it, b, today));
    for (const it of closed) bucketEl.appendChild(cardEl(it, b, today));
    if (b.ghosts && b.ghosts.length) {
      for (const g of b.ghosts) bucketEl.appendChild(ghostEl(g));
    }

    listEl.appendChild(bucketEl);
  }

  if (archived.length) {
    const line = document.createElement("div");
    line.className = "archive-line";
    line.textContent = showArchived
      ? "收起这 " + archived.length + " 件已提交的"
      : "另有 " + archived.length + " 件已提交且过了截止日 · 点这展开";
    line.addEventListener("click", function () {
      showArchived = !showArchived;
      render();
    });
    listEl.appendChild(line);
  }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/** 幽灵方框：这一天碰过别的日期的任务。点一下跳到那张卡。 */
function ghostEl(g) {
  const el = document.createElement("div");
  el.className = "ghost";
  const mark = document.createElement("span");
  mark.className = "gmark";
  mark.textContent = "◌";
  el.appendChild(mark);
  const who = document.createElement("span");
  who.className = "gt";
  who.textContent = g.title;
  el.appendChild(who);
  if (g.text) {
    const note = document.createElement("span");
    note.className = "gnote";
    note.textContent = "· " + g.text;
    el.appendChild(note);
  }
  const to = document.createElement("span");
  to.className = "gd";
  to.textContent = g.due ? "→ " + g.due.slice(5).replace("-", "/") : "→ 以后";
  el.appendChild(to);
  el.title = "点一下跳到「" + g.title + "」";
  el.addEventListener("click", function () {
    const card = document.querySelector('[data-id="' + g.taskId + '"]');
    if (card) {
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.style.transition = "box-shadow .3s";
      card.style.boxShadow = "0 0 0 3px rgba(61,99,214,.35)";
      setTimeout(function () { card.style.boxShadow = ""; }, 1200);
    } else {
      toast("那张卡在「" + (g.due ? g.due : "以后") + "」那一栏");
    }
  });
  return el;
}

function cardEl(it, bucket, today) {
  const c = document.createElement("div");
  const cls = ["card"];
  if (it.status === "submitted") {
    cls.push("done");
    if (!it.needsSubmit) cls.push("plain-done");   // 没有提交环节，就是做完了
  }
  if (it.status === "done") { cls.push("done"); cls.push("pending"); }
  if (it.status === "dropped") cls.push("dropped");
  if (it.logCount) cls.push("has-log");
  c.className = cls.join(" ");
  c.dataset.id = it.id;

  // 拖拽把手
  const grip = document.createElement("div");
  grip.className = "grip";
  grip.title = "拖动换次序（只在同一天内部有效）";
  c.appendChild(grip);

  const main = document.createElement("div");
  main.className = "main";

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = it.title;
  title.title = "双击改名";
  title.addEventListener("dblclick", function () { rename(it, title); });
  main.appendChild(title);

  const meta = document.createElement("div");
  meta.className = "meta";

  // 截止日期：只显示，改期走"改期"按钮（避免和桶标题上的日期重复）
  if (it.due) {
    const dueText = document.createElement("span");
    dueText.textContent = "截止 " + it.due.slice(5).replace("-", "/");
    dueText.style.cursor = "pointer";
    dueText.title = "点这里改截止日期";
    dueText.addEventListener("click", function () { pickDate(it, "due", dueText); });
    meta.appendChild(dueText);
  } else {
    const add = document.createElement("span");
    add.textContent = "＋ 加期限";
    add.style.cssText = "cursor:pointer;color:var(--caption)";
    add.addEventListener("click", function () { pickDate(it, "due", add); });
    meta.appendChild(add);
  }

  if (it.overdue) meta.insertAdjacentHTML("beforeend", '<span class="flag hot">逾期 ' + Math.abs(it.daysLeft) + ' 天</span>');
  else if (it.dueToday) meta.insertAdjacentHTML("beforeend", '<span class="flag hot">今天到期</span>');
  else if (it.kickoff) meta.insertAdjacentHTML("beforeend", '<span class="flag warn">该动手了</span>');
  else if (it.quietDays !== null && it.quietDays >= 7) meta.insertAdjacentHTML("beforeend", '<span class="flag warn">' + it.quietDays + ' 天没碰</span>');

  if (it.needsSubmit) meta.insertAdjacentHTML("beforeend", '<span class="flag">需提交</span>');
  if (it.logCount) meta.insertAdjacentHTML("beforeend", '<span class="flag">碰过 ' + it.logCount + ' 次</span>');

  main.appendChild(meta);

  let sessionRows = null;
  if (Array.isArray(it.sessions) && it.sessions.length) {
    c.classList.add("has-sessions");
    const sv = document.createElement("div");
    sv.className = "session-links";
    for (const sess of it.sessions) {
      const wrap = document.createElement("div");
      wrap.className = "session-row";
      const open = document.createElement("button");
      open.type = "button";
      open.className = "session-open";
      open.title = "打开对话：" + (sess.title || sess.id);
      const mark = document.createElement("span");
      mark.className = "session-mark";
      mark.textContent = "↗";
      mark.setAttribute("aria-hidden", "true");
      open.appendChild(mark);
      const copy = document.createElement("span");
      copy.className = "session-copy";
      const name = document.createElement("span");
      name.className = "session-title";
      name.textContent = sess.title || "会话 " + String(sess.id).slice(-6);
      copy.appendChild(name);
      const detail = document.createElement("span");
      detail.className = "session-meta";
      detail.textContent = "关联对话 · 点击继续";
      copy.appendChild(detail);
      open.appendChild(copy);
      open.addEventListener("click", function () { openSession(sess.id); });
      wrap.appendChild(open);
      const unlink = document.createElement("button");
      unlink.type = "button";
      unlink.className = "session-unlink";
      unlink.textContent = "解除挂载";
      unlink.title = "解除挂载";
      unlink.setAttribute("aria-label", "解除挂载：" + (sess.title || sess.id));
      unlink.addEventListener("click", async function () {
        unlink.disabled = true;
        try {
          await api("/items/" + encodeURIComponent(it.id) + "/sessions?sessionId=" + encodeURIComponent(sess.id), "DELETE");
          await refresh();
          toast("已解除挂载");
        } catch (e) { unlink.disabled = false; toast(e.message, true); }
      });
      wrap.appendChild(unlink);
      sv.appendChild(wrap);
    }
    sessionRows = sv;
  }

  // 过程记录
  const logline = document.createElement("div");
  logline.className = "logline";
  if (it.log && it.log.length) {
    let prev = null;
    it.log.forEach(function (e, idx) {
      if (prev) {
        const gap = Math.round((new Date(e.at) - new Date(prev)) / 86400000);
        if (gap > 1) {
          const q = document.createElement("div");
          q.className = "quiet";
          q.textContent = "· " + gap + " 天没动";
          logline.appendChild(q);
        }
      }
      const row = document.createElement("div");
      row.className = "entry";
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = shortDate(e.at);
      row.appendChild(when);
      const what = document.createElement("span");
      what.className = "what";
      what.textContent = e.text;
      row.appendChild(what);
      row.appendChild(logDel(it, e, idx));
      logline.appendChild(row);
      prev = e.at;
    });
  }
  main.appendChild(logline);

  const loginput = document.createElement("div");
  loginput.className = "loginput";
  const inp = document.createElement("input");
  inp.type = "text";
  inp.placeholder = "记一句今天做了什么，回车保存";
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && inp.value.trim()) {
      e.preventDefault();
      const text = inp.value.trim();
      inp.value = "";
      api("/items/" + encodeURIComponent(it.id) + "/log", "POST", { text: text })
        .then(function () { return refresh(); })
        .then(function () { toast("记下了"); })
        .catch(function (err) { toast(err.message, true); });
    }
    if (e.key === "Escape") { c.classList.remove("logging"); }
  });
  loginput.appendChild(inp);
  main.appendChild(loginput);

  c.appendChild(main);
  c.appendChild(xDel(it));

  // 操作
  const acts = document.createElement("div");
  acts.className = "acts";
  if (it.status === "open") {
    acts.appendChild(mkBtn("记一笔", function () {
      c.classList.toggle("logging");
      if (c.classList.contains("logging")) inp.focus();
    }));
    acts.appendChild(mkBtn("完成", function () {
      api("/items/" + encodeURIComponent(it.id) + "/finish", "POST")
        .then(function () { return refresh(); })
        .catch(function (e) { toast(e.message, true); });
    }, "done-btn"));
  } else if (it.status === "done") {
    acts.appendChild(mkBtn("标记已提交", function () {
      api("/items/" + encodeURIComponent(it.id) + "/submit", "POST")
        .then(function () { return refresh(); })
        .then(function () { toast("已提交"); })
        .catch(function (e) { toast(e.message, true); });
    }, "done-btn"));
    acts.appendChild(mkBtn("撤回", function () {
      patch(it.id, { status: "open" }).catch(function (e) { toast(e.message, true); });
    }));
  } else {
    acts.appendChild(mkBtn("撤回", function () {
      patch(it.id, { status: "open" }).catch(function (e) { toast(e.message, true); });
    }));
  }
  c.appendChild(acts);
  if (sessionRows) {
    const face = document.createElement("div");
    face.className = "task-face";
    while (c.firstChild) face.appendChild(c.firstChild);
    c.appendChild(face);
    c.appendChild(sessionRows);
  }

  bindDrag(c, it, bucket);
  return c;
}

/** 就地改日期：把 span 换成一个临时的 date input。 */
function pickDate(it, field, anchor) {
  const inp = document.createElement("input");
  inp.type = "date";
  inp.value = (field === "due" ? it.due : it.startBy) || "";
  inp.style.cssText = "font:inherit;font-size:11.5px;border:1px solid var(--accent);border-radius:5px;padding:1px 4px";
  anchor.replaceWith(inp);
  inp.focus();
  if (inp.showPicker) { try { inp.showPicker(); } catch (_) {} }
  let done = false;
  const commit = async function (save) {
    if (done) return;
    done = true;
    if (save) {
      const body = {};
      body[field] = inp.value || "";
      try { await patch(it.id, body); return; } catch (e) { toast(e.message, true); }
    }
    await refresh();
  };
  inp.addEventListener("change", function () { commit(true); });
  inp.addEventListener("blur", function () { commit(true); });
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); inp.value = ""; commit(false); }
  });
}

/** 删一条记录：点一次变红，再点一次真删。 */
function logDel(it, entry, index) {
  const b = document.createElement("button");
  b.className = "delx";
  b.textContent = "×";
  b.title = "删掉这条记录";
  let armed = false;
  let timer = null;
  b.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!armed) {
      armed = true;
      b.classList.add("armed");
      b.textContent = "删?";
      timer = setTimeout(function () {
        armed = false;
        b.classList.remove("armed");
        b.textContent = "×";
      }, 3000);
      return;
    }
    clearTimeout(timer);
    b.disabled = true;
    const q = entry.id
      ? "?logId=" + encodeURIComponent(entry.id)
      : "?index=" + index;
    api("/items/" + encodeURIComponent(it.id) + "/log" + q, "DELETE")
      .then(function () { return refresh(); })
      .then(function () { toast("删掉了"); })
      .catch(function (err) { b.disabled = false; b.textContent = "×"; toast(err.message, true); });
  });
  return b;
}

/** 删除：点第一次变成"确定删？"，3 秒内再点一次才真删。 */
function xDel(it) {
  const b = document.createElement("button");
  b.className = "xdel";
  b.textContent = "×";
  b.title = "删除这条";
  let armed = false;
  let timer = null;
  b.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!armed) {
      armed = true;
      b.classList.add("armed");
      b.textContent = "确定删？";
      timer = setTimeout(function () {
        armed = false;
        b.classList.remove("armed");
        b.textContent = "×";
      }, 3000);
      return;
    }
    clearTimeout(timer);
    b.disabled = true;
    b.textContent = "…";
    api("/items/" + encodeURIComponent(it.id), "DELETE")
      .then(function () { return refresh(); })
      .then(function () { toast("已删除「" + it.title + "」"); })
      .catch(function (err) {
        b.disabled = false;
        b.textContent = "×";
        toast(err.message, true);
      });
  });
  return b;
}

function mkBtn(label, fn, cls) {
  const b = document.createElement("button");
  b.textContent = label;
  if (cls) b.className = cls;
  b.addEventListener("click", function (e) { e.stopPropagation(); fn(); });
  return b;
}

/* ---------- 从工作区挂载对话；与事项排序使用不同事件 ---------- */
const SESSION_MIME = "application/x-dsh-session";
function clearSessionDrag() {
  document.body.classList.remove("session-drag");
  listEl.querySelectorAll(".session-over").forEach(function (el) { el.classList.remove("session-over"); });
}
window.addEventListener("message", function (event) {
  if (event.origin !== location.origin || event.source !== parent || event.data?.source !== "dsh-priority") return;
  if (event.data.type === "pri:drag-state") {
    clearSessionDrag();
    document.body.classList.toggle("session-drag", event.data.active === true);
  }
  if (event.data.type === "pri:error") toast(String(event.data.message), true);
});
listEl.addEventListener("dragover", function (event) {
  if (!Array.from(event.dataTransfer?.types || []).includes(SESSION_MIME)) return;
  const card = event.target.closest(".card[data-id]");
  if (!card) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "copy";
  listEl.querySelectorAll(".session-over").forEach(function (el) { if (el !== card) el.classList.remove("session-over"); });
  document.body.classList.add("session-drag");
  card.classList.add("session-over");
});
listEl.addEventListener("dragleave", function (event) {
  const card = event.target.closest(".card[data-id]");
  if (card && !card.contains(event.relatedTarget)) card.classList.remove("session-over");
});
listEl.addEventListener("drop", async function (event) {
  if (!Array.from(event.dataTransfer?.types || []).includes(SESSION_MIME)) return;
  const card = event.target.closest(".card[data-id]");
  if (!card) { clearSessionDrag(); return; }
  event.preventDefault();
  clearSessionDrag();
  parent.postMessage({ source: "dsh-priority", type: "pri:drag-finished" }, location.origin);
  try {
    const session = JSON.parse(event.dataTransfer.getData(SESSION_MIME));
    if (typeof session.id !== "string" || !session.id.trim() || session.id.length > 256) throw new Error("无效的对话，请从左侧工作区重新拖动");
    await api("/items/" + encodeURIComponent(card.dataset.id) + "/sessions", "POST", {
      sessionId: session.id, title: typeof session.title === "string" ? session.title : "",
    });
    await refresh();
    toast("已挂载对话，点击标题即可跳转");
  } catch (e) { toast(e.message, true); }
});
window.addEventListener("dragend", clearSessionDrag);
parent.postMessage({ source: "dsh-priority", type: "pri:ready" }, location.origin);

/* ---------- 拖拽换次序（只在同一天内部） ---------- */
let dragState = null;

function bindDrag(card, it, bucket) {
  const grip = card.querySelector(".grip");
  grip.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    const siblings = Array.from(card.parentElement.querySelectorAll(".card"));
    dragState = {
      id: it.id,
      due: bucket.date,
      el: card,
      origin: siblings.map(function (n) { return n.dataset.id; }),
    };
    card.classList.add("dragging");
    grip.setPointerCapture(e.pointerId);
  });

  grip.addEventListener("pointermove", function (e) {
    if (!dragState) return;
    const y = e.clientY;
    const siblings = Array.from(dragState.el.parentElement.children)
      .filter(function (n) { return n.classList.contains("card") && n !== dragState.el; });
    for (const other of siblings) {
      const r = other.getBoundingClientRect();
      if (y > r.top && y < r.bottom) {
        const rectA = dragState.el.getBoundingClientRect();
        // 指针在目标上半 → 插到前面，下半 → 插到后面
        const after = y > r.top + r.height / 2;
        if (after) other.after(dragState.el);
        else other.before(dragState.el);
        break;
      }
    }
  });

  const finishDrag = function () {
    if (!dragState) return;
    const state = dragState;
    dragState = null;
    state.el.classList.remove("dragging");
    const now = Array.from(state.el.parentElement.children)
      .filter(function (n) { return n.classList.contains("card"); })
      .map(function (n) { return n.dataset.id; });
    const changed = now.join(",") !== state.origin.join(",");
    if (!changed) return;
    api("/reorder", "POST", { due: state.due, ids: now })
      .then(function () { return refresh(); })
      .catch(function (e) { toast(e.message, true); refresh(); });
  };
  grip.addEventListener("pointerup", finishDrag);
  grip.addEventListener("pointercancel", finishDrag);
}

/* ---------- 写操作 ---------- */
async function patch(id, body) {
  await api("/items/" + encodeURIComponent(id), "PATCH", body);
  await refresh();
}

function rename(it, titleEl) {
  const inp = document.createElement("input");
  inp.type = "text";
  inp.value = it.title;
  inp.style.cssText = "width:100%;font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--accent);border-radius:6px;padding:3px 6px;outline:none";
  titleEl.replaceWith(inp);
  inp.focus();
  inp.select();
  let done = false;
  const commit = async function () {
    if (done) return;
    done = true;
    const v = inp.value.trim();
    if (v && v !== it.title) {
      try { await patch(it.id, { title: v }); } catch (e) { toast(e.message, true); }
    } else {
      await refresh();
    }
  };
  inp.addEventListener("blur", commit);
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
    if (e.key === "Escape") { inp.value = it.title; inp.blur(); }
  });
}

/* ---------- 新建对话框 ---------- */
const dlg = document.getElementById("dlg");
document.getElementById("btnNew").onclick = function () {
  document.getElementById("fTitle").value = "";
  document.getElementById("fDue").value = "";
  document.getElementById("fSubmit").checked = false;
  dlg.showModal();
  document.getElementById("fTitle").focus();
};
dlg.addEventListener("close", async function () {
  if (dlg.returnValue !== "ok") return;
  const title = document.getElementById("fTitle").value.trim();
  if (!title) { toast("标题不能为空", true); return; }
  try {
    await api("/items", "POST", {
      title: title,
      due: document.getElementById("fDue").value || null,
      needsSubmit: document.getElementById("fSubmit").checked,
    });
    await refresh();
  } catch (e) { toast(e.message, true); }
});

function openSession(id) {
  try {
    parent.postMessage({ source: "dsh-priority", type: "pri:open-session", sessionId: id }, location.origin);
  } catch (e) {
    toast("打不开会话：" + e.message, true);
  }
}

document.getElementById("dPrev").onclick = function () {
  setViewDay(isoAddDay(viewDay || V.today, -1));
};
document.getElementById("dNext").onclick = function () {
  setViewDay(isoAddDay(viewDay || V.today, 1));
};
document.getElementById("dPick").onchange = function (e) {
  if (e.target.value) setViewDay(e.target.value);
};
document.getElementById("dToday").onclick = function () { setViewDay(null); };

document.getElementById("btnRefresh").onclick = function () {
  refresh().then(function () { toast("已刷新"); }).catch(function (e) { toast(e.message, true); });
};

/* ---------- 加载 ---------- */
function holdDays(it, today) {
  const from = it.doneAt || it.submittedAt;
  if (!from) return 0;
  const a = Date.parse(String(from).slice(0, 10) + "T00:00:00Z");
  const b = Date.parse(today + "T00:00:00Z");
  return Math.round((b - a) / 86400000);
}

function isoAddDay(iso, n) {
  const t = Date.parse(iso + "T00:00:00Z");
  return new Date(t + n * 86400000).toISOString().slice(0, 10);
}

function syncNav() {
  const pick = document.getElementById("dPick");
  const rel = document.getElementById("dRel");
  const back = document.getElementById("dToday");
  if (!V) return;
  pick.value = viewDay || V.today;
  if (!viewDay) {
    rel.textContent = "今天";
    back.style.display = "none";
  } else {
    const diff = Math.round((Date.parse(viewDay + "T00:00:00Z") - Date.parse(V.today + "T00:00:00Z")) / 86400000);
    rel.textContent = diff === -1 ? "昨天" : diff < 0 ? (-diff) + " 天前" : diff === 1 ? "明天" : diff + " 天后";
    back.style.display = "";
  }
}

function setViewDay(d) {
  viewDay = d && d !== (V ? V.today : null) ? d : null;
  refresh().catch(function (e) { toast(e.message, true); });
}

async function refresh() {
  V = await api("/state");
  if (viewDay && viewDay !== V.today) {
    D = await api("/day?date=" + encodeURIComponent(viewDay));
  } else {
    viewDay = null;
    D = null;
  }
  syncNav();
  render();
}

window.addEventListener("focus", function () {
  if (document.querySelector(".logging")) return;
  refresh().catch(function () {});
});

// 支持 ?day=YYYY-MM-DD 直接打开某一天（也方便截图和分享）
const qsDay = new URLSearchParams(location.search).get("day");
if (qsDay && /^\d{4}-\d{2}-\d{2}$/.test(qsDay)) viewDay = qsDay;

refresh().catch(function (e) {
  listEl.innerHTML = '<div class="empty">连不上后端：' + esc(e.message) + '</div>';
});
