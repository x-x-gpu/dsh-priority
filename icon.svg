  <circle cx="32" cy="18" r="3.2" fill="#fff" fill-opacity=".5"/>
  <circle cx="32" cy="30" r="3.8" fill="#fff" fill-opacity=".78"/>
  <circle cx="32" cy="43" r="5.4" fill="#fff"/>
  <circle cx="32" cy="52.5" r="2.2" fill="#fff" fill-opacity=".42"/>
